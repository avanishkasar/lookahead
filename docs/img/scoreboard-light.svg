<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 382" width="920" height="382" role="img" aria-label="Four ways to size a sandbox pool. lookahead and a big fixed pool keep no request waiting; lookahead idles 7.6 hours of sandboxes against 8.2. KEDA keeps 56 percent of requests waiting with 2.3 idle hours; a small fixed pool 70 percent with 0.9."><style>text{font-family:system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif}</style><rect width="920" height="382" rx="14" fill="#fcfcfb"/><text x="28" y="40" font-size="20" font-weight="650" fill="#1a1a19">10 minutes of bursty agent traffic, 151 sandbox requests</text><text x="300" y="80" font-size="13" font-weight="600" fill="#6b6a64">Requests that kept an agent waiting</text><text x="600" y="80" font-size="13" font-weight="600" fill="#6b6a64">Idle sandboxes you pay for</text><rect x="14" y="92" width="892" height="54" rx="10" fill="#f3f2ee"/><text x="28" y="114" font-size="15" font-weight="700" fill="#1a1a19">lookahead</text><text x="28" y="133" font-size="12.5" fill="#6b6a64">warms the pool before each burst</text><rect x="300" y="106" width="250" height="18" rx="5" fill="#e4e3dd"/><text x="558" y="120" font-size="14" font-weight="700" fill="#199e70">none</text><rect x="600" y="106" width="250" height="18" rx="5" fill="#e4e3dd"/><rect x="600" y="106" width="230.3" height="18" rx="5" fill="#2a78d6"/><text x="858" y="120" font-size="14" font-weight="700" fill="#1a1a19">7.6 h</text><text x="28" y="176" font-size="15" font-weight="600" fill="#1a1a19">Big fixed pool</text><text x="28" y="195" font-size="12.5" fill="#6b6a64">45 sandboxes always on</text><rect x="300" y="168" width="250" height="18" rx="5" fill="#e4e3dd"/><text x="558" y="182" font-size="14" font-weight="700" fill="#199e70">none</text><rect x="600" y="168" width="250" height="18" rx="5" fill="#e4e3dd"/><rect x="600" y="168" width="250.0" height="18" rx="5" fill="#2a78d6"/><text x="858" y="182" font-size="14" font-weight="700" fill="#1a1a19">8.2 h</text><text x="28" y="238" font-size="15" font-weight="600" fill="#1a1a19">KEDA autoscaler</text><text x="28" y="257" font-size="12.5" fill="#6b6a64">grows after requests arrive</text><rect x="300" y="230" width="250" height="18" rx="5" fill="#e4e3dd"/><rect x="300" y="230" width="139.0" height="18" rx="5" fill="#d03b3b"/><text x="558" y="244" font-size="14" font-weight="700" fill="#d03b3b">56%</text><rect x="600" y="230" width="250" height="18" rx="5" fill="#e4e3dd"/><rect x="600" y="230" width="70.7" height="18" rx="5" fill="#2a78d6"/><text x="858" y="244" font-size="14" font-weight="700" fill="#1a1a19">2.3 h</text><text x="28" y="300" font-size="15" font-weight="600" fill="#1a1a19">Small fixed pool</text><text x="28" y="319" font-size="12.5" fill="#6b6a64">5 sandboxes always on</text><rect x="300" y="292" width="250" height="18" rx="5" fill="#e4e3dd"/><rect x="300" y="292" width="175.5" height="18" rx="5" fill="#d03b3b"/><text x="558" y="306" font-size="14" font-weight="700" fill="#d03b3b">70%</text><rect x="600" y="292" width="250" height="18" rx="5" fill="#e4e3dd"/><rect x="600" y="292" width="27.8" height="18" rx="5" fill="#2a78d6"/><text x="858" y="306" font-size="14" font-weight="700" fill="#1a1a19">0.9 h</text></svg>