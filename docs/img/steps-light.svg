<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="920" height="150" role="img" aria-label="How it works in three steps: the agent gives a heads-up, lookahead warms the pool, the agent gets its sandboxes instantly."><style>text{font-family:system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif}</style><rect width="920" height="150" rx="14" fill="#fcfcfb"/><rect x="28" y="22" width="272" height="106" rx="12" fill="#f3f2ee"/><circle cx="58" cy="52" r="15" fill="#2a78d6"/><text x="58" y="57.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="82" y="57.5" font-size="15" font-weight="650" fill="#1a1a19">Agent gives a heads-up</text><text x="46" y="92" font-size="13" fill="#6b6a64">“I’ll need 30 sandboxes</text><text x="46" y="111" font-size="13" fill="#6b6a64">from this pool in 45 s.”</text><path d="M305 75 l14 0 m-5 -5 l5 5 l-5 5" stroke="#6b6a64" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="22" width="272" height="106" rx="12" fill="#f3f2ee"/><circle cx="356" cy="52" r="15" fill="#2a78d6"/><text x="356" y="57.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="380" y="57.5" font-size="15" font-weight="650" fill="#1a1a19">lookahead warms the pool</text><text x="344" y="92" font-size="13" fill="#6b6a64">It starts 30 sandboxes now,</text><text x="344" y="111" font-size="13" fill="#6b6a64">while the agent keeps working.</text><path d="M603 75 l14 0 m-5 -5 l5 5 l-5 5" stroke="#6b6a64" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="624" y="22" width="272" height="106" rx="12" fill="#f3f2ee"/><circle cx="654" cy="52" r="15" fill="#199e70"/><text x="654" y="57.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="678" y="57.5" font-size="15" font-weight="650" fill="#1a1a19">Agent gets them instantly</text><text x="642" y="92" font-size="13" fill="#6b6a64">They are ready when it asks.</text><text x="642" y="111" font-size="13" fill="#6b6a64">Spares shut down afterwards.</text></svg>