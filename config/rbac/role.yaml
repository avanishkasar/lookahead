---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lookahead-controller
rules:
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxwarmpools
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - lookahead.avanishkasar.github.io
  resources:
  - demandhints
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - lookahead.avanishkasar.github.io
  resources:
  - lookaheadpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lookahead.avanishkasar.github.io
  resources:
  - lookaheadpolicies/status
  verbs:
  - get
  - patch
  - update
