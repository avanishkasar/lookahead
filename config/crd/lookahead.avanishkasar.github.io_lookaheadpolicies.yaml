---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lookaheadpolicies.lookahead.avanishkasar.github.io
spec:
  group: lookahead.avanishkasar.github.io
  names:
    kind: LookaheadPolicy
    listKind: LookaheadPolicyList
    plural: lookaheadpolicies
    shortNames:
    - lap
    singular: lookaheadpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .status.desiredReplicas
      name: Desired
      type: integer
    - jsonPath: .status.forecastReplicas
      name: Forecast
      type: integer
    - jsonPath: .status.hintReplicas
      name: Hints
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LookaheadPolicy sizes a SandboxWarmPool ahead of demand from
          a claim forecast and DemandHints.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LookaheadPolicySpec defines predictive sizing for one SandboxWarmPool.
            properties:
              forecast:
                description: forecast configures the arrival forecaster.
                properties:
                  alphaPercent:
                    default: 50
                    description: alphaPercent is the level smoothing factor in percent
                      (1-100). Higher reacts faster.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  betaPercent:
                    default: 10
                    description: betaPercent is the trend smoothing factor in percent
                      (0-100). Ignored for EWMA.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  bucketSeconds:
                    default: 5
                    description: bucketSeconds is the width of one arrival-count bucket.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  historySeconds:
                    default: 1800
                    description: historySeconds is how much arrival history the forecaster
                      fits on.
                    format: int32
                    maximum: 3600
                    minimum: 60
                    type: integer
                  model:
                    default: Holt
                    description: model is the forecaster. Defaults to Holt.
                    enum:
                    - None
                    - EWMA
                    - Holt
                    type: string
                  safetyFactorPercent:
                    default: 100
                    description: |-
                      safetyFactorPercent scales the Poisson headroom term z*sqrt(expected), with z in percent.
                      0 disables headroom.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                type: object
              leadTimeSeconds:
                default: 30
                description: |-
                  leadTimeSeconds is how far ahead the pool is sized: the time a new sandbox needs to become
                  Ready. Hints start counting this long before their neededAt.
                format: int32
                maximum: 3600
                minimum: 1
                type: integer
              maxReplicas:
                description: maxReplicas is the upper bound of the pool size, including
                  hints.
                format: int32
                minimum: 0
                type: integer
              minReplicas:
                default: 0
                description: minReplicas is the lower bound of the pool size.
                format: int32
                minimum: 0
                type: integer
              poolRef:
                description: |-
                  poolRef is the SandboxWarmPool in this namespace whose spec.replicas this policy sets.
                  Immutable: a policy that should target another pool is a new policy.
                properties:
                  name:
                    description: name of the SandboxWarmPool.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: poolRef is immutable
                  rule: self == oldSelf
              scaleDownStabilizationSeconds:
                default: 60
                description: |-
                  scaleDownStabilizationSeconds is the window whose highest recommendation is applied, so
                  the pool grows immediately and shrinks only after demand has stayed low this long.
                format: int32
                maximum: 3600
                minimum: 0
                type: integer
            required:
            - maxReplicas
            - poolRef
            type: object
            x-kubernetes-validations:
            - message: minReplicas must be less than or equal to maxReplicas
              rule: '!has(self.minReplicas) || self.minReplicas <= self.maxReplicas'
          status:
            description: LookaheadPolicyStatus is the observed state of a LookaheadPolicy.
            properties:
              activeHints:
                description: activeHints is the number of DemandHints active at the
                  last recommendation.
                format: int32
                type: integer
              conditions:
                description: conditions describe the policy's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredReplicas:
                description: desiredReplicas is the stabilized, clamped target last
                  computed for the pool.
                format: int32
                type: integer
              forecastReplicas:
                description: forecastReplicas is the forecast part of the last recommendation.
                format: int32
                type: integer
              hintReplicas:
                description: hintReplicas is the sum of replicas of active DemandHints
                  at the last recommendation.
                format: int32
                type: integer
              lastScaleTime:
                description: lastScaleTime is when this policy last changed the pool's
                  spec.replicas.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
