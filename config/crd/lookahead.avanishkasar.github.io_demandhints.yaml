---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: demandhints.lookahead.avanishkasar.github.io
spec:
  group: lookahead.avanishkasar.github.io
  names:
    kind: DemandHint
    listKind: DemandHintList
    plural: demandhints
    shortNames:
    - dh
    singular: demandhint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.neededAt
      name: NeededAt
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DemandHint is a short-lived declaration of upcoming SandboxClaims
          for a pool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DemandHintSpec declares that the creator expects to claim
              replicas sandboxes from a pool.
            properties:
              neededAt:
                description: |-
                  neededAt is when the sandboxes are needed. The hint starts counting one lead time
                  (LookaheadPolicy.spec.leadTimeSeconds) before it. Defaults to the creation time.
                format: date-time
                type: string
              poolRef:
                description: poolRef is the SandboxWarmPool in this namespace the
                  sandboxes will be claimed from.
                properties:
                  name:
                    description: name of the SandboxWarmPool.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: poolRef is immutable
                  rule: self == oldSelf
              replicas:
                description: replicas is how many sandboxes the creator expects to
                  claim.
                format: int32
                maximum: 10000
                minimum: 1
                type: integer
              ttlSeconds:
                default: 300
                description: |-
                  ttlSeconds is how long after neededAt the hint keeps counting. The controller deletes the
                  hint when it expires, so a crashed creator never keeps a pool inflated.
                format: int32
                maximum: 86400
                minimum: 1
                type: integer
            required:
            - poolRef
            - replicas
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
