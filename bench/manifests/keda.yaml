apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bench-pool
  namespace: lookahead-bench
spec:
  scaleTargetRef:
    apiVersion: extensions.agents.x-k8s.io/v1beta1
    kind: SandboxWarmPool
    name: bench-pool
  minReplicaCount: 2
  maxReplicaCount: 60
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.lookahead-bench.svc:9090
      query: sum(rate(agent_sandbox_claim_creation_total{namespace="lookahead-bench", warmpool_name="bench-pool"}[1m])) or vector(0)
      threshold: "0.05"
